# ====================================================================
# Smart City Noise Pollution Spatial Mapping & Compliance System
# Application Configuration
# ====================================================================

spring.application.name=smart-city-noise-monitor
server.port=8080

# Profile Selection:
# Use 'dev' for immediate embedded MySQL-compatible testing (runs out of the box)
# Use 'mysql' to connect to your local MySQL Server 8.0 & MySQL Workbench
spring.profiles.active=dev

# Disable automatic SQL script runner (Hibernate DDL & DataInitializer manage tables)
spring.sql.init.mode=never

# File Upload Configuration (supports CSV batch dataset import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Static Web Assets (Dashboard, Maps, Forms)
spring.web.resources.static-locations=classpath:/static/
